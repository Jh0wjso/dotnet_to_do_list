apiVersion: apps/v1
kind: Deployment

metadata:
  name: todo-api
  namespace: todo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: todo-api
  
  template:
    metadata:
      labels:
        app: todo-api
    
    spec:
      containers:
      - name: todo-api
        image: todo-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
