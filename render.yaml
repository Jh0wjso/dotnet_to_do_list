services:
  - type: web
    name: todolist-api
    runtime: docker
    dockerfilePath: ./ToDoList.Api/Dockerfile
    dockerContext: ./ToDoList.Api
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: JWT_SECRET
        sync: false
      - key: JWT_ISSUER
        value: ToDoListApi
      - key: JWT_AUDIENCE
        value: ToDoListClient
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: API_URL
        sync: false
